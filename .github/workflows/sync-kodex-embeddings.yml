name: Sync Kodex embeddings

# 벨로그 새 글을 자동으로 반영해서 챗 위젯의 RAG 인덱스(kodex-embeddings.json)를 최신 상태로 유지한다.
# kodex-code-review-agent(스크립트가 있는 저장소)를 체크아웃해서 fetch_posts.py → build_index.py를
# 그대로 실행하고, 결과를 이 저장소의 src/data/kodex-embeddings.json에 덮어쓴 뒤 변경분만 커밋·푸시한다.
# 푸시되면 Vercel이 자동으로 재배포한다 (Day9에 연결해둔 GitHub 연동).

on:
  schedule:
    - cron: "0 21 * * *" # 매일 21:00 UTC = 06:00 KST
  workflow_dispatch: {} # 수동 실행 버튼 (Actions 탭에서 바로 트리거 가능)

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout kodex-portfolio-site
        uses: actions/checkout@v4

      - name: Checkout kodex-code-review-agent (스크립트 + 로직)
        uses: actions/checkout@v4
        with:
          repository: DoyuIm/kodex-code-review-agent
          path: kodex-code-review-agent

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install agent dependencies
        working-directory: kodex-code-review-agent
        run: pip install -r requirements.txt

      - name: Seed incremental cache (안 바뀐 글은 재임베딩하지 않도록)
        run: cp src/data/kodex-embeddings.json kodex-code-review-agent/embeddings.json

      - name: Fetch latest Velog posts
        working-directory: kodex-code-review-agent
        run: python fetch_posts.py doro

      - name: Rebuild embeddings (증분 업데이트)
        working-directory: kodex-code-review-agent
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python build_index.py

      - name: Copy embeddings into site data
        run: cp kodex-code-review-agent/embeddings.json src/data/kodex-embeddings.json

      - name: Commit and push if changed
        run: |
          git config user.name "kodex-bot"
          git config user.email "kodex-bot@users.noreply.github.com"
          git add src/data/kodex-embeddings.json
          if git diff --cached --quiet; then
            echo "새 글이 없어서 변경사항이 없어요. 스킵합니다."
          else
            git commit -m "chore: 벨로그 최신 글로 임베딩 자동 갱신"
            git push
          fi
